name: Publicar no Easypanel

# A cada envio para a main (ou manualmente pela aba Actions), aciona o
# "Deploy Webhook" do serviço no Easypanel, que baixa o repositório,
# gera a imagem pelo Dockerfile e publica o site.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-easypanel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EASYPANEL_DEPLOY_WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
      SITE_URL: ${{ vars.SITE_URL || 'https://rfconsultoriabancaria.com.br/' }}
    steps:
      - name: Conferir configuração
        id: cfg
        run: |
          if [ -z "$EASYPANEL_DEPLOY_WEBHOOK" ]; then
            echo "::warning::Publicação automática ainda não configurada: cadastre o segredo EASYPANEL_DEPLOY_WEBHOOK (Settings > Secrets and variables > Actions)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Acionar publicação no Easypanel
        if: steps.cfg.outputs.ok == 'true'
        run: |
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' --max-time 30 -X POST "$EASYPANEL_DEPLOY_WEBHOOK" || echo 000)
          echo "Resposta do Easypanel: HTTP $code"
          case "$code" in
            2??) echo "Publicação solicitada." ;;
            *) echo "::error::O Easypanel recusou o pedido (HTTP $code). Confira se o endereço do Deploy Webhook está correto."; head -c 500 /tmp/resp.txt; exit 1 ;;
          esac

      - name: Conferir site no ar
        if: steps.cfg.outputs.ok == 'true'
        run: |
          # A imagem leva alguns minutos para ser gerada; espera até a versão nova responder
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$SITE_URL" | grep -q 'terra-noite-nasa'; then
              echo "Site novo respondendo em $SITE_URL"; exit 0
            fi
            sleep 20
          done
          echo "::warning::O Easypanel recebeu o pedido, mas $SITE_URL ainda não mostra a versão nova. Veja a aba Deployments do serviço no Easypanel."
