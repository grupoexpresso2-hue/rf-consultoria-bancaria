name: Publicar no VPS

# Publica o site no VPS a cada envio para a main (ou manualmente pela aba Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rf-consultoria-bancaria' }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
      HOST_PORT: ${{ vars.HOST_PORT }}
      SITE_URL: ${{ vars.SITE_URL || 'https://rfconsultoriabancaria.com.br/' }}
      REPO_URL: https://github.com/${{ github.repository }}.git

    steps:
      - name: Conferir configuração
        id: cfg
        run: |
          missing=""
          for v in VPS_HOST VPS_USER VPS_SSH_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Publicação automática ainda não configurada. Falta(m) o(s) segredo(s):$missing (Settings > Secrets and variables > Actions)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar código
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Preparar acesso SSH
        if: steps.cfg.outputs.ok == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Não foi possível obter a chave do servidor $VPS_HOST:$VPS_PORT."; exit 1; }

      - name: Publicar no servidor
        if: steps.cfg.outputs.ok == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- $(printf '%q ' "$DEPLOY_PATH" "$CONTAINER_NAME" "$HOST_PORT" "$REPO_URL" "${GITHUB_REF_NAME}")" \
            < deploy/deploy.sh

      - name: Conferir site no ar
        if: steps.cfg.outputs.ok == 'true'
        run: |
          for i in $(seq 1 10); do
            if curl -fsSL --max-time 15 "$SITE_URL" | grep -q 'terra-noite-nasa'; then
              echo "Site novo respondendo em $SITE_URL"; exit 0
            fi
            sleep 6
          done
          echo "::warning::O servidor foi atualizado, mas $SITE_URL ainda não mostra a versão nova (cache ou proxy?)."
